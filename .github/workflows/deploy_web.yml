name: Deploy Web to GitHub Pages

on:
  push:
    branches:
      - main      # main ブランチへの push 時に自動デプロイ
  workflow_dispatch:  # 手動実行ボタン（Actions 画面から手動起動可能）

# GitHub Pages への書き込み権限
permissions:
  contents: read
  pages: write
  id-token: write

# 同時デプロイを防ぐ
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # .env ファイルを GitHub Secret から生成（Secret名: MAPBOX_ACCESS_TOKEN）
      - name: Create .env file
        run: echo "MAPBOX_ACCESS_TOKEN=${{ secrets.MAPBOX_ACCESS_TOKEN }}" > .env

      # sqlite3.wasm を pub キャッシュから web/ にコピー
      # GitHub Pages では OPFS/SharedArrayBuffer が使えないため IndexedDB フォールバック用に必要
      - name: Copy sqlite3.wasm for web
        run: |
          WASM=$(find "$HOME/.pub-cache" -name "sqlite3.wasm" | head -1)
          if [ -n "$WASM" ]; then
            cp "$WASM" web/sqlite3.wasm
            echo "Copied sqlite3.wasm from: $WASM"
          else
            echo "sqlite3.wasm not found in pub cache, skipping"
          fi

      - name: Build Web
        run: flutter build web --base-href /rihabirirunn/ --release

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
